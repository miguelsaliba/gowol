<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Gowol</title>
    </head>
    <body>
        <p><b>Enter a Mac Address, IP broadcast, and port to wake on lan:</b></p>

        <form action="/wol" method="POST">
            <label for="mac">Mac Address:</label>
            <input type="text" id="mac" name="mac" required>
            <br><br>
            <label for="broadcast">IP Broadcast:</label>
            <input type="text" id="broadcast" name="broadcast" required>
            <br><br>
            <label for="port">Port:</label>
            <input type="number" id="port" name="port" required>
            <br><br>
            <button type="submit">Wake on LAN</button>
        </form>

    </body>
</html>
