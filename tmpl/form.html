<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Gowol</title>
    </head>

    <body>
        <form>
            <p><b>Enter a Mac Address, IP broadcast, and port to wake on lan:</b></p>

            <label>
                Mac Address:
                <input
                    type="text"
                    id="mac"
                    name="mac"
                    pattern="([0-9A-Fa-f]{2}[\-:.]?){5}([0-9A-Fa-f]{2})"
                    title="Please enter a 6 byte mac address"
                    value="{{ if .Mac }}{{ .Mac }}{{ end }}"
                    placeholder="11:22:33:44:55:66"
                    required
                />
            </label>
            <br><br>
            <label>
                IP Broadcast:
                <input
                    type="text"
                    id="broadcast"
                    name="broadcast"
                    pattern="(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)"
                    title="Please enter a valid IP broadcast range"
                    value="{{ if .Broadcast }}{{ .Broadcast }}{{ else }}255.255.255.255{{ end }}"
                    placeholder="255.255.255.255"
                    required
                />
            </label>
            <br><br>
            <label>
                Port:
                <input
                    type="number"
                    id="port"
                    name="port"
                    value="{{ if .Port }}{{ .Port }}{{ else }}9{{ end }}"
                    placeholder="9"
                    min="1"
                    max="65535"
                    required
                />
            </label>
            <br><br>
            <button type="submit">Wake on LAN</button>
        </form>

        {{ with .Err }}
            <br>
            <div class="error">{{ . }}</div>
        {{ end }}

        {{ with .Msg }}
            <br>
            <div class="message">{{ . }}</div>
        {{ end }}
    </body>
</html>
